server.port=8080

# Application Details
spring.application.name=ecommerce-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Concurrency & Virtual Threads (Java 21 Project Loom)
spring.threads.virtual.enabled=true

# Embedded Tomcat Tuning for High Concurrency (10,000 Concurrent Users Target)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=30
server.tomcat.max-connections=10000
server.tomcat.accept-count=1000
server.tomcat.connection-timeout=15000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Default H2 In-Memory Database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:ecommerce_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Connection Pool Defaults (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:50}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:15}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=NovaMartHikariPool

# H2 Console (Disabled in production by default)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Performance Tuning
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.jakarta.persistence.query.timeout=5000

# Caching Configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=categories,brands,deliveryZones,productDetail
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=60s

# Configurable Rate Limiting
app.rate-limiting.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limiting.general-capacity=${RATE_LIMIT_GENERAL_CAPACITY:300}
app.rate-limiting.general-refill-rate=${RATE_LIMIT_GENERAL_REFILL:50.0}
app.rate-limiting.auth-capacity=${RATE_LIMIT_AUTH_CAPACITY:5}
app.rate-limiting.auth-refill-rate=${RATE_LIMIT_AUTH_REFILL:0.0833}

# Production Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=86400000

# File Upload / Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

